<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FARREL ADMIN</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Anton&family=Urbanist:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <style>
        .admin-wrap {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 16px 60px;
        }

        .admin-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid rgba(75, 160, 255, 0.4);
            background: linear-gradient(135deg, rgba(18, 105, 255, 0.95), #07162f 55%, #020305);
        }

        .admin-topbar h1 {
            font-family: "Anton", sans-serif;
            font-size: 22px;
            letter-spacing: 2px;
            color: #b8f8ff;
            text-shadow: 0 0 10px #00bfff;
        }

        .admin-logout {
            padding: 9px 16px;
            border-radius: 20px;
            border: 1px solid rgba(100, 180, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        #admin-login-screen {
            max-width: 360px;
            margin: 80px auto;
            padding: 30px;
            border: 1px solid rgba(100, 180, 255, 0.35);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.04);
            text-align: center;
        }

        #admin-login-screen h2 {
            font-family: "Anton", sans-serif;
            color: #b8f8ff;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        #admin-login-screen input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border-radius: 10px;
            border: 1px solid #254a75;
            background: rgba(255, 255, 255, 0.07);
            color: white;
        }

        #admin-login-screen button {
            width: 100%;
            padding: 13px;
            border-radius: 10px;
            border: 2px solid #ffffff;
            background: linear-gradient(135deg, #7ceeff, #00aeea);
            color: #00131c;
            font-weight: 900;
        }

        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin: 20px 0;
        }

        .admin-stat {
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(100, 180, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .admin-stat strong {
            display: block;
            font-size: 26px;
            color: #7ceeff;
        }

        .admin-stat span {
            font-size: 12px;
            color: #9db5c9;
            letter-spacing: 1px;
        }

        .admin-filter {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .admin-filter button {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1px solid rgba(100, 180, 255, 0.4);
            background: rgba(255, 255, 255, 0.06);
            color: #cfe9ff;
            font-size: 13px;
        }

        .admin-filter button.active {
            background: #00bfff;
            color: #00131c;
            font-weight: 800;
        }

        .admin-order-card {
            padding: 16px;
            margin-bottom: 14px;
            border-radius: 16px;
            border: 1px solid rgba(100, 180, 255, 0.25);
            background: rgba(255, 255, 255, 0.05);
        }

        .admin-order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .admin-order-top h3 {
            color: #b8f8ff;
            font-size: 16px;
        }

        .admin-order-card p {
            font-size: 13px;
            color: #cfe9ff;
            margin: 3px 0;
        }

        .admin-item-line {
            font-size: 12px;
            color: #9db5c9;
            padding-left: 10px;
        }

        .admin-status-select {
            margin-top: 10px;
            padding: 9px 12px;
            border-radius: 10px;
            border: 1px solid #254a75;
            background: rgba(255, 255, 255, 0.08);
            color: white;
        }

        .admin-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .badge-received { background: rgba(255, 215, 90, 0.15); color: #ffd75a; }
        .badge-processing { background: rgba(0, 191, 255, 0.15); color: #58dcff; }
        .badge-shipped { background: rgba(160, 120, 255, 0.15); color: #c3a8ff; }
        .badge-delivered { background: rgba(70, 220, 140, 0.15); color: #6dffbb; }
        .badge-cancelled { background: rgba(255, 90, 90, 0.15); color: #ff9a9a; }
    </style>
</head>

<body>

    <div class="admin-topbar">
        <h1>🛠️ FARREL ADMIN</h1>
        <button class="admin-logout" onclick="adminLogout()" style="display:none;" id="admin-logout-btn">Logout</button>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="admin-login-screen">
        <h2>Admin Sign In</h2>
        <input type="email" id="admin-email" placeholder="Admin email">
        <input type="password" id="admin-password" placeholder="Password">
        <button onclick="adminLogin()">SIGN IN</button>
        <p id="admin-login-error" style="color:#ff9a9a; font-size:12px; margin-top:10px;"></p>
    </div>

    <!-- DASHBOARD -->
    <div class="admin-wrap" id="admin-dashboard" style="display:none;">

        <div class="admin-stats" id="admin-stats"></div>

        <div class="admin-filter" id="admin-filter">
            <button class="active" data-status="All" onclick="setAdminFilter('All')">All</button>
            <button data-status="Order Received" onclick="setAdminFilter('Order Received')">Received</button>
            <button data-status="Processing" onclick="setAdminFilter('Processing')">Processing</button>
            <button data-status="Shipped" onclick="setAdminFilter('Shipped')">Shipped</button>
            <button data-status="Delivered" onclick="setAdminFilter('Delivered')">Delivered</button>
            <button data-status="Cancelled" onclick="setAdminFilter('Cancelled')">Cancelled</button>
        </div>

        <div id="admin-orders-list">
            <p>Loading orders...</p>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="admin.js"></script>
</body>

</html>
